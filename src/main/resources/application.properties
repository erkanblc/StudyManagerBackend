spring.application.name=StudyManager

spring.datasource.url=jdbc:mysql://localhost:3306/study_manager_db?zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=Europe/Berlin
spring.datasource.username=root
spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=StudyManagerSecretKeyHS512VeryLongAndSecure1234567890ABCDEF
# Access token lifetime (24 hours) — no password prompt within the day
jwt.expiration=86400000
# Refresh token absolute lifetime from login (7 days) — does not extend on refresh
jwt.refresh-expiration=604800000

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.studymanager.controller

# ── Goals ─────────────────────────────────────────────────────────────────────
# Daily job: mark ACTIVE/PAUSED goals past endDate as OVERDUE (default 01:00)
app.goals.overdue-cron=0 0 1 * * *
